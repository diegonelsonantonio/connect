<!-- Contenedor principal con centrado y diseño de tarjeta -->
<div class="min-h-screen flex items-center justify-center relative overflow-hidden">
  <!-- Efectos de luces de fondo -->
  <div class="absolute inset-0 bg-gradient-to-br from-purple-600 via-pink-600 to-purple-800">
    <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-pink-400 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
    <div class="absolute top-1/3 right-1/4 w-64 h-64 bg-purple-400 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
    <div class="absolute bottom-1/4 left-1/3 w-64 h-64 bg-yellow-400 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000"></div>
  </div>
  
  <!-- Tarjeta de login con efecto glassmorphism y luces en el borde -->
  <div class="relative z-10 max-w-md mx-auto bg-white/10 backdrop-blur-lg rounded-xl shadow-2xl overflow-hidden md:max-w-lg p-8 animate-fade-in border-animated">
    <!-- Icono central con brillo -->
    <div class="flex justify-center mb-6">
      <div class="w-16 h-16 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full flex items-center justify-center shadow-lg animate-pulse">
        <span class="text-white font-bold text-2xl">✦</span>
      </div>
    </div>
    
    <!-- Título con efecto de brillo -->
    <h1 class="text-3xl font-bold text-center text-white mb-2 bg-gradient-to-r from-pink-300 to-purple-300 bg-clip-text text-transparent">
      Welcome to Connect
    </h1>
    <p class="text-center text-white/80 mb-8">Share your moments with the world</p>

<div
  class="bg-white/90 backdrop-blur-sm rounded-xl shadow-lg p-8 animate-fade-in"
>
  <!-- Selector para cambiar entre Login y Registro -->
  <div class="flex justify-center mb-6 border-b-2">
    <button
      (click)="authMode.set('login')"
      [class.border-rosa]="authMode() === 'login'"
      [class.text-rosa]="authMode() === 'login'"
      class="px-6 py-2 focus:outline-none border-b-2 font-semibold transition-colors duration-300"
    >
      Login
    </button>
    <button
      (click)="authMode.set('register')"
      [class.border-rosa]="authMode() === 'register'"
      [class.text-rosa]="authMode() === 'register'"
      class="px-6 py-2 focus:outline-none border-b-2 font-semibold transition-colors duration-300"
    >
      Registro
    </button>
  </div>

  <!-- Título dinámico -->
  <h2 class="text-2xl font-bold text-center text-marino mb-6">
    {{ authMode() === "login" ? "Bienvenido de Vuelta" : "Crea tu Cuenta" }}
  </h2>

  <!-- Formulario (manejado por ngModel del archivo .ts) -->
  <form (submit)="handleAuthSubmit()" class="space-y-4">
    <!-- Campo de Username (solo para registro) -->
    @if(authMode() === 'register') {
    <div>
      <label for="username" class="block text-sm font-medium text-gray-700"
        >Nombre de Usuario</label
      >
      <input
        [(ngModel)]="authForm.username"
        id="username"
        name="username"
        type="text"
        required
        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-rosa focus:border-rosa"
      />
    </div>
    }

    <!-- Campo de Email (solo para registro) -->
    @if(authMode() === 'register') {
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700"
        >Email</label
      >
      <input
        [(ngModel)]="authForm.email"
        id="email"
        name="email"
        type="email"
        required
        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-rosa focus:border-rosa"
      />
    </div>
    }

    <!-- Campo de Username para login -->
    @if(authMode() === 'login') {
    <div>
      <label
        for="username-login"
        class="block text-sm font-medium text-gray-700"
        >Nombre de Usuario</label
      >
      <input
        [(ngModel)]="authForm.username"
        id="username-login"
        name="username-login"
        type="text"
        required
        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-rosa focus:border-rosa"
      />
    </div>
    }

    <!-- Campo de Contraseña -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700"
        >Contraseña</label
      >
      <input
        [(ngModel)]="authForm.password"
        id="password"
        name="password"
        type="password"
        required
        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-rosa focus:border-rosa"
      />
    </div>

    <!-- Botón de envío -->
    <button
      type="submit"
      [disabled]="isLoading()"
      class="w-full bg-rosa text-white py-2 px-4 rounded-md hover:bg-opacity-90 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-rosa disabled:bg-gray-400"
    >
      {{
        isLoading()
          ? "Cargando..."
          : authMode() === "login"
          ? "Entrar"
          : "Registrarse"
      }}
    </button>
  </form>

    <!-- Mensaje de error -->
    @if(apiError()){
    <p class="mt-4 text-center text-red-500 font-medium">{{ apiError() }}</p>
    }
  </div>
</div>
</div>
