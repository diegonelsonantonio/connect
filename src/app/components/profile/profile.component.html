@if(isLoading()){
  <div class="flex justify-center items-center h-64">
     <div class="loader animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-rosa"></div>
  </div>
} @else {
  <!-- Vista que se muestra solo si hay un usuario logueado -->
  @if(currentUser(); as user) {
    <div class="animate-fade-in">
      <!-- Sección de Información del Perfil -->
      <div id="profile-info" class="text-center mb-10">
        <img class="h-24 w-24 rounded-full mx-auto object-cover border-4 border-white shadow-lg"
             [src]="'https://placehold.co/150x150/e91e63/white?text=' + user.username.charAt(0).toUpperCase()"
             [alt]="user.username">
        <h1 class="text-3xl font-bold mt-4 text-marino">{{ user.username }}</h1>
        <p class="text-gray-500">{{ '@' + user.username.toLowerCase() }}</p>
      </div>

      <!-- Galería de Fotos del Usuario -->
      <div id="gallery-container" class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Iteramos sobre la señal 'userPosts' del archivo .ts -->
        @for(post of userPosts(); track post._id) {
          <div class="aspect-square bg-gray-200 rounded-lg overflow-hidden group relative">
            <img [src]="post.image_url" [alt]="post.description"
                 class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110">
            <!-- Opcional: Mostrar un overlay con información al pasar el mouse -->
            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-50 transition-all duration-300 flex items-center justify-center">
               <p class="text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300 px-2 text-center">{{ post.description }}</p>
            </div>
          </div>
        } @empty {
          <!-- Mensaje si el usuario no tiene posts -->
          <div class="text-center text-gray-500 col-span-full py-16">
            <p>Aún no has subido ninguna foto.</p>
            <a (click)="navigateToUpload()" class="text-rosa font-semibold hover:underline cursor-pointer">¡Sube una ahora!</a>
          </div>
        }
      </div>
    </div>
  }
}

@if(apiError()){
  <p class="mt-4 text-center text-red-500">{{ apiError() }}</p>
}
