<!-- Contenedor principal con diseño de tarjeta -->
<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-md animate-fade-in">
  <h2 class="text-2xl font-bold text-center text-marino mb-6">Crear una nueva publicación</h2>

  <!-- Formulario de subida -->
  <form (submit)="handleUpload($event)" class="space-y-6">
    <!-- Input para seleccionar el archivo de imagen -->
    <div>
      <label for="image-file" class="block text-sm font-medium text-gray-700 mb-2">Foto</label>
      <input (change)="onFileSelected($event)" type="file" id="image-file" name="image" accept="image/*" required
             class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-rosa/10 file:text-rosa hover:file:bg-rosa/20 cursor-pointer">
    </div>

    <!-- Campo de texto para la descripción -->
    <div>
      <label for="description" class="block text-sm font-medium text-gray-700">Descripción</label>
      <textarea [(ngModel)]="description" id="description" name="description" rows="4" required
                placeholder="Escribe algo sobre tu foto..."
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-rosa focus:border-rosa"></textarea>
    </div>

    <!-- Botón para publicar -->
    <button type="submit" [disabled]="isLoading()"
            class="w-full bg-rosa text-white py-2 px-4 rounded-md hover:bg-opacity-90 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-rosa disabled:bg-gray-400 disabled:cursor-not-allowed flex justify-center items-center">
      @if (isLoading()) {
        <!-- Pequeño spinner para indicar que se está subiendo -->
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Publicando...</span>
      } @else {
        <span>Publicar</span>
      }
    </button>
  </form>

  <!-- Mensaje de estado de la subida -->
  <div class="mt-4 text-center font-medium"
       [class.text-green-600]="!apiError()"
       [class.text-red-500]="apiError()">
    {{ uploadStatus() }}
  </div>
</div>
